  <style>

    .birth-date-controls {
      display: grid;

      grid-template-columns:
        auto
        auto
        minmax(180px, 1fr)
        auto
        auto;

      gap: 8px;

      align-items: center;

      width: 100%;
    }


    .birth-date-shift {
      height: 42px;

      padding:
        0
        11px;

      border:
        1px solid
        rgba(255, 255, 255, 0.10);

      border-radius: 12px;

      color:
        rgba(255, 255, 255, 0.82);

      background:
        rgba(255, 255, 255, 0.055);

      cursor: pointer;

      white-space: nowrap;

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
    }


    .birth-date-shift:hover {
      background:
        rgba(255, 255, 255, 0.10);

      border-color:
        rgba(255, 255, 255, 0.18);

      transform:
        translateY(-1px);
    }


    .birth-date-controls input[type="date"] {
      min-width: 0;
    }


    @media (max-width: 700px) {

      .birth-date-controls {
        grid-template-columns:
          repeat(
            4,
            1fr
          );
      }


      .birth-date-controls input[type="date"] {
        grid-column:
          1 / -1;

        grid-row:
          1;
      }


      .birth-date-shift {
        padding:
          0
          6px;

        font-size: 11px;
      }

    }

  </style>

  <!-- =========================================
       생년월일 연도 조절

       birthDate 값 자체를 변경하므로
       기존 사주 계산 로직 그대로 사용 가능
  ========================================== -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        const birthDate =
          document.getElementById(
            "birthDate"
          );


        const buttons =
          document.querySelectorAll(
            "[data-year-shift]"
          );


        /* -------------------------------------
           윤년
        ------------------------------------- */

        function isLeapYear(
          year
        ) {

          return (

            year % 400 === 0

            ||

            (
              year % 4 === 0
              &&
              year % 100 !== 0
            )

          );

        }


        /* -------------------------------------
           해당 월의 마지막 날짜
        ------------------------------------- */

        function getLastDay(
          year,
          month
        ) {

          const table = [

            31,

            isLeapYear(
              year
            )
              ? 29
              : 28,

            31,
            30,
            31,
            30,
            31,
            31,
            30,
            31,
            30,
            31

          ];


          return table[
            month - 1
          ];

        }


        /* -------------------------------------
           2자리
        ------------------------------------- */

        function pad2(
          value
        ) {

          return String(
            value
          ).padStart(
            2,
            "0"
          );

        }


        /* -------------------------------------
           연도 이동
        ------------------------------------- */

        function shiftYear(
          amount
        ) {

          let year;
          let month;
          let day;


          if (
            birthDate.value
          ) {

            const [
              y,
              m,
              d
            ] =
              birthDate.value
                .split("-")
                .map(Number);


            year =
              y;

            month =
              m;

            day =
              d;

          }

          else {

            const now =
              new Date();


            year =
              now.getFullYear();

            month =
              now.getMonth() + 1;

            day =
              now.getDate();

          }


          year +=
            amount;


          /*
            2월 29일에서
            윤년이 아닌 해로 이동할 경우
            2월 28일로 자동 보정
          */

          day =
            Math.min(

              day,

              getLastDay(
                year,
                month
              )

            );


          birthDate.value =

            `${year}-${pad2(month)}-${pad2(day)}`;


          /*
            기존 폼 / 계산 코드가
            날짜 변경을 감지할 수 있도록 전달
          */

          birthDate.dispatchEvent(
            new Event(
              "input",
              {
                bubbles: true
              }
            )
          );


          birthDate.dispatchEvent(
            new Event(
              "change",
              {
                bubbles: true
              }
            )
          );

        }


        /* -------------------------------------
           버튼 연결
        ------------------------------------- */

        buttons.forEach(
          button => {

            button.addEventListener(
              "click",
              () => {

                const amount =
                  Number(
                    button.dataset.yearShift
                  );


                if (
                  !Number.isFinite(
                    amount
                  )
                ) {

                  return;

                }


                shiftYear(
                  amount
                );

              }
            );

          }
        );

      }
    );

  </script>
